name: Export sports recipe contribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest
      - name: Build source artifact without credentials
        run: |
          docker build \
            --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "TEMPLATE_VERSION=2.0.0" \
            --tag "weynear/sports-live-scores:contribution-check" \
            templates/sports-live-scores
      - name: Export source recipe
        run: |
          mkdir -p contribution
          python scripts/prepare_sports_contribution.py \
            --source-commit "${GITHUB_SHA}" \
            --destination-root contribution
      - uses: actions/upload-artifact@v6
        with:
          name: sports-live-scores-contribution-${{ github.sha }}
          path: contribution/
          if-no-files-found: error
